<style>
  :root{
    --bone:#F3F1EB;--navy:#1F3864;--deep:#111D33;--amber:#D9912B;--steel:#7C8698;
    --disp:'Archivo',system-ui,sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
    --radius:22px;--ok:#8FD49B;--warn:#E8B15E;--bad:#E77D6A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:linear-gradient(160deg,#14213C 0%,#0F1A30 60%,#182B50 100%);font-family:var(--body);color:var(--bone);-webkit-font-smoothing:antialiased}
  /* Tek sayfa sürüm: test her zaman açık, kapatma düğmesi gizli */
  .rx-overlay{display:flex !important;position:fixed;inset:0;z-index:1;flex-direction:column}
  .rx-close{display:none}

  .rx-overlay{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:linear-gradient(160deg,#14213C 0%,#0F1A30 60%,#182B50 100%)}
  .rx-overlay.open{display:flex}
  .rx-overlay::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(243,241,235,.06) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
  .rx-top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;position:relative;z-index:2}
  .rx-title{font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--amber)}
  .rx-close{background:transparent;border:1.5px solid rgba(243,241,235,.35);color:var(--bone);width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;transition:all .15s}
  .rx-close:hover{border-color:var(--amber);color:var(--amber)}
  .rx-main{flex:1;display:block;padding:16px 20px 32px;position:relative;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .rx-stage{width:min(560px,100%);margin:0 auto;border-radius:26px;min-height:min(62vh,500px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px 24px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;border:1px solid rgba(243,241,235,.14);background:rgba(243,241,235,.04);transition:background .12s;color:var(--bone);will-change:background-color}
  .rx-stage.rx-waiting{background:rgba(224,102,102,.10);border-color:rgba(224,102,102,.4)}
  .rx-stage.rx-go{background:var(--amber);border-color:var(--amber);color:var(--deep);transition:none}
  .rx-stage.rx-early{background:rgba(224,102,102,.2);border-color:#E06666}
  .rx-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.26em;color:var(--amber);text-transform:uppercase;margin-bottom:14px}
  .rx-stage.rx-go .rx-eyebrow{color:var(--deep)}
  .rx-stage h3{font-family:var(--disp);font-weight:900;font-size:clamp(24px,6vw,38px);line-height:1.1;letter-spacing:-.01em;color:inherit}
  .rx-stage p{margin-top:14px;font-size:15px;color:var(--steel);max-width:36ch}
  .rx-stage.rx-go p{color:rgba(20,33,60,.75)}
  .rx-ms{font-family:var(--disp);font-weight:900;font-size:clamp(64px,16vw,110px);line-height:1;letter-spacing:-.02em}
  .rx-ms.rx-live{font-variant-numeric:tabular-nums;color:rgba(243,241,235,.45)}
  .rx-stage.rx-go .rx-ms.rx-live{color:var(--deep)}
  .rx-ms.rx-live i{color:inherit;opacity:.7}
  .rx-ms i{font-style:normal;font-size:.32em;color:var(--amber);font-weight:800}
  .rx-stage.rx-go .rx-ms i{color:var(--deep)}
  .rx-rounds{display:flex;gap:10px;margin-top:22px}
  .rx-dot{width:12px;height:12px;border-radius:50%;background:rgba(243,241,235,.18)}
  .rx-dot.rx-done{background:var(--amber)}
  .rx-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);font-weight:800;font-size:15px;padding:13px 26px;border-radius:999px;border:none;cursor:pointer;background:var(--amber);color:var(--deep);margin-top:24px;transition:transform .12s}
  .rx-btn:active{transform:scale(.97)}
  .rx-btn.rx-ghost{background:transparent;border:1.5px solid rgba(243,241,235,.4);color:var(--bone)}
  .rx-word{font-family:var(--disp);font-weight:900;font-size:clamp(30px,9vw,46px);letter-spacing:.06em;line-height:1;margin-top:14px}
  .rx-word.wait{color:rgba(243,241,235,.55)}
  .rx-word.now{color:var(--deep)}
  .rx-count{font-family:var(--disp);font-weight:900;font-size:clamp(110px,28vw,180px);line-height:1;color:var(--bone);letter-spacing:-.03em}
  .rx-cta{display:block;width:100%;max-width:340px;margin:18px auto 0;background:var(--amber);color:var(--deep);font-family:var(--disp);font-weight:900;font-size:18px;letter-spacing:-.01em;padding:18px 20px;border-radius:18px;border:none;cursor:pointer;text-align:center;transition:transform .12s}
  .rx-cta:active{transform:scale(.98)}
  .rx-cta small{display:block;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.2em;margin-top:4px;opacity:.75}
  .rx-cardimg{display:block;width:100%;max-width:230px;margin:16px auto 0;border-radius:14px;border:1px solid rgba(243,241,235,.18)}
  .rx-raw{margin-top:14px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:rgba(243,241,235,.4);line-height:1.7;max-width:340px}
  .rx-raw span{color:rgba(243,241,235,.3)}
  .rx-name{max-width:340px;margin:12px auto 0}
  .rx-name input{width:100%;background:rgba(243,241,235,.06);border:1px solid rgba(243,241,235,.2);border-radius:12px;padding:11px 14px;color:var(--bone);font-family:var(--body);font-size:14px;text-align:center}
  .rx-name input::placeholder{color:rgba(243,241,235,.4)}
  .rx-name input:focus{outline:none;border-color:var(--amber)}
  .rx-name small{display:block;margin-top:6px;font-size:11px;color:rgba(243,241,235,.45);line-height:1.5}
  .rx-verdict{margin:0 auto 14px;max-width:340px;border-radius:14px;padding:11px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;line-height:1.5}
  .rx-verdict span{display:block;margin-top:5px;font-size:9.5px;letter-spacing:.14em;opacity:.7}
  .rx-verdict.win{background:rgba(46,125,50,.18);border:1px solid rgba(143,212,155,.45);color:#8FD49B}
  .rx-verdict.lose{background:rgba(231,125,106,.12);border:1px solid rgba(231,125,106,.45);color:#E77D6A}
  .rx-share{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .rx-share-btn{display:inline-flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;font-size:12.5px;padding:9px 14px;border-radius:999px;border:1.5px solid rgba(243,241,235,.25);color:var(--bone);background:transparent;cursor:pointer;transition:all .15s}
  .rx-share-btn:hover{border-color:var(--amber);color:var(--amber)}
  .rx-share-btn i{font-size:16px}
  .rx-share-btn.wa:hover{border-color:#25D366;color:#25D366}
  .rx-share-btn.ig:hover{border-color:#E1306C;color:#E1306C}
  .rx-btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .rx-resgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px;margin-top:22px}
  .rx-rescell{border:1px solid rgba(243,241,235,.14);border-radius:14px;padding:12px}
  .rx-rescell .rx-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--steel);text-transform:uppercase}
  .rx-rescell .rx-val{font-family:var(--disp);font-weight:900;font-size:24px;margin-top:4px}
  .rx-rescell .rx-val i{font-style:normal;font-size:12px;color:var(--amber)}
  .rx-rating{margin-top:16px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:#8FD49B;border:1px solid rgba(143,212,155,.4);border-radius:10px;padding:8px 14px;display:inline-block}
  .rx-intro{width:100%;max-width:460px;text-align:left}
  .rx-intro h3{text-align:center}
  .rx-intro .rx-sub{text-align:center;margin-top:8px}
  .rx-steps{list-style:none;margin:18px 0 0;display:grid;gap:10px}
  .rx-steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px;color:var(--bone);line-height:1.5}
  .rx-steps li b{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amber);padding-top:3px;font-weight:500}
  .rx-key{margin-top:14px;text-align:center;font-size:13px;line-height:1.6;color:var(--steel)}
  .rx-key b{font-weight:500}
  .rx-key .c-red{color:#E88A8A}
  .rx-key .c-amb{color:var(--amber)}
  .rx-why{margin-top:16px;font-size:13px;line-height:1.6;color:var(--steel)}
  .rx-why b{color:var(--bone);font-weight:500}
  .rx-why details{margin-top:8px}
  .rx-why summary{cursor:pointer;color:var(--amber);font-family:var(--mono);font-size:11px;letter-spacing:.14em;list-style:none}
  .rx-why summary::-webkit-details-marker{display:none}
  .rx-why details p{margin-top:8px}
  .rx-checks{margin-top:18px;display:grid;gap:10px;border-top:1px solid rgba(243,241,235,.12);padding-top:16px}
  .rx-checks label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:13px;line-height:1.5;color:var(--bone);cursor:pointer}
  .rx-checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--amber)}
  .rx-checks small{display:block;font-size:11.5px;color:var(--steel)}
  .rx-checks a{color:var(--amber);text-decoration:underline}
  .rx-cta[disabled]{opacity:.4;cursor:not-allowed;transform:none}
  .rx-consent{max-height:170px;overflow-y:auto;text-align:left;font-size:12.5px;line-height:1.6;color:var(--steel);border:1px solid rgba(243,241,235,.16);border-radius:12px;padding:14px 16px;margin-top:16px;width:100%;max-width:430px}
  .rx-consent b{color:var(--bone)}
  .rx-foot{padding:14px 22px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--steel);position:relative;z-index:2}
  .rx-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bone);color:var(--deep);font-family:var(--mono);font-size:12.5px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:120}
  .rx-toast.rx-show{opacity:1}
</style>
</head>
<body>

<div class="rx-overlay" id="rxOverlay" aria-hidden="true" role="dialog" aria-label="Reaksiyon testi">
  <div class="rx-top">
    <div class="rx-title">REACTO ⚡</div>
    <button class="rx-close" id="rxClose" aria-label="Kapat">×</button>
  </div>
  <div class="rx-main">
    <div class="rx-stage" id="rxStage"><div id="rxContent"></div></div>
  </div>
  <div class="rx-foot">locomotion.com.tr</div>
</div>
<div class="rx-toast" id="rxToast"></div>

<script>
/* ---------- Reaksiyon Lab modal engine ---------- */
(function(){
  const TOTAL_ROUNDS = 7;
  const TOTAL_PRACTICE = 2;
  const overlay = document.getElementById('rxOverlay');
  const stage = document.getElementById('rxStage');
  const content = document.getElementById('rxContent');
  const toast = document.getElementById('rxToast');
  const closeBtn = document.getElementById('rxClose');

  const CONSENT_KEY='locomotion_kvkk_ok';
  const raw={
    get(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { window.localStorage.setItem(k,v); } catch(e){} }
  };
  let allowStore=false, allowStats=false;
  const STATS_ENDPOINT=''; // salon istatistik uç noktası; boşsa gönderim yapılmaz
  function sendStats(payload){ if(!allowStats||!STATS_ENDPOINT) return; try{ fetch(STATS_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true}).catch(function(){}); }catch(e){} }
  const store={
    get(k){ return allowStore ? raw.get(k) : null; },
    set(k,v){ if(allowStore) raw.set(k,v); }
  };
  const CONSENT_HTML=
    '<b>KVKK Aydınlatma Metni — Reaksiyon Lab</b><br><br>'+
    'Bu test sırasında ad, soyad, iletişim bilgisi gibi kişisel veriler toplanmaz ve hiçbir bilgi sunucuya gönderilmez.<br><br>'+
    'Onay vermeniz halinde yalnızca <b>en iyi skorunuz</b>, tekrar oynadığınızda gösterilmek üzere tarayıcınızın yerel depolama alanında — kendi cihazınızda — saklanır. Bu veri bize iletilmez ve tarayıcı site verilerinizi temizleyerek dilediğiniz an silebilirsiniz.<br><br>'+
    '"Meydan Oku" özelliği yalnızca sizin paylaşmayı seçtiğiniz bir bağlantı oluşturur; otomatik paylaşım yapılmaz.<br><br>'+
    '<b>Meydan okuma bağlantısı:</b> Oluşturduğunuz bağlantıda yalnızca yazdığınız takma ad, skorunuz ve tarih taşınır. Bu bilgiler Locomotion\u2019a iletilmez ve saklanmaz; bağlantı sizin cihazınızda üretilir, kiminle paylaşacağınıza siz karar verirsiniz. Takma ad zorunlu değildir ve gerçek adınız olmak zorunda değildir.<br><br>'+
    '<b>Anonim istatistik (isteğe bağlı):</b> Ayrıca onay verirseniz yalnızca tur süreleriniz (milisaniye), erken dokunma sayınız ve test tarihi, hiçbir kimlik, cihaz veya IP bilgisi olmadan Locomotion\u2019a iletilir. Amaç, ziyaretçi ortalamasını hesaplamaktır. Veri kişiyle eşleştirilemediğinden geri çağrılamaz; onayı her testte yeniden verirsiniz, kutuyu işaretlemezseniz hiçbir şey gönderilmez.<br><br>'+
    'Ayrıntılı bilgi ve veri sorumlusu iletişim bilgileri için: locomotion.com.tr/kvkk<br>'+
    'Veri Sorumlusu: [Locomotion — ticari unvan/adres]';

  let state='idle', times=[], earlyCount=0, roundsDone=0, goAt=0, timerId=null, rafId=null, cdId=null;
  let practiceMode=false, practiceIndex=0, challengeTarget=null, duelRound=1, myLastScore=null;
  let leaderName=null, leaderAt=null;
  function esc(t){ return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function cleanName(t){ return String(t||'').replace(/[^\p{L}\p{N} ._-]/gu,'').trim().slice(0,20); }
  function agoText(ts){
    if(!ts) return '';
    const d=Math.floor((Date.now()-ts)/86400000);
    const h=Math.floor((Date.now()-ts)/3600000);
    if(d>=1) return d+' gün önce';
    if(h>=1) return h+' saat önce';
    return 'az önce';
  }
  let actx=null;
  function beep(freq,dur,vol){
    try{
      if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state==='suspended') actx.resume();
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||0.15,actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
    }catch(e){}
  }
  function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function clearAll(){ clearTimeout(timerId); clearTimeout(cdId); cancelAnimationFrame(rafId); }
  function countdown(){
    state='countdown'; stage.className='rx-stage';
    let n=3;
    function step(){
      if(n===0){ startRound(); return; }
      const lbl = practiceMode ? 'Deneme başlıyor' : (roundsDone===0 ? 'Gerçek ölçüm başlıyor' : 'Hazır ol');
      content.innerHTML=
        '<div class="rx-eyebrow">'+lbl+'</div>'+
        '<div class="rx-count">'+n+'</div>';
      n--; cdId=setTimeout(step,1000);
    }
    step();
  }
  function fmt(ms){ return String(Math.max(0,Math.round(ms))); }
  function counter(ms){ return '<div class="rx-ms rx-live">'+fmt(ms)+'<i> ms</i></div>'; }
  let liveEl=null;             // amber ekranındaki canlı sayaç düğümü
  function tick(){
    if(liveEl) liveEl.firstChild.nodeValue=fmt(performance.now()-goAt);
    rafId=requestAnimationFrame(tick);
  }

  /* ---- Meydan okuma kartı (paylaşımda görselin kendisi gitsin) ---- */
  let cardFile=null, cardUrl=null;     // 4:5 \u2014 WhatsApp / DM
  let storyFile=null, storyUrl=null;   // 9:16 \u2014 Instagram hikaye
  function drawCard(score, band, name, avgScore, valid, early, url, tall){
    const W=1080,H=tall?1920:1350,c=document.createElement('canvas');
    c.width=W; c.height=H;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,W*0.6,H);
    g.addColorStop(0,'#14213C'); g.addColorStop(.55,'#0F1A30'); g.addColorStop(1,'#182B50');
    x.fillStyle=g; x.fillRect(0,0,W,H);
    x.fillStyle='rgba(243,241,235,0.055)';
    for(let yy=40;yy<H;yy+=44){ for(let xx=40;xx<W;xx+=44){ x.beginPath(); x.arc(xx,yy,2.2,0,6.2832); x.fill(); } }
    function sp(v){ try{ x.letterSpacing=v; }catch(e){} }
    x.textAlign='center';

    sp('6px');
    x.font='600 26px Archivo, sans-serif'; x.fillStyle='rgba(243,241,235,0.5)';
    x.fillText('LOCOMOTION  \u00b7  REACTO', W/2, H*0.080);

    sp('7px');
    x.font='500 30px "IBM Plex Mono", monospace'; x.fillStyle='#D9912B';
    x.fillText(name? name.toUpperCase()+' \u2014 TAHTTAKİ SKOR' : 'TAHTTAKİ SKOR', W/2, H*0.222);

    sp('-10px');
    x.font='900 300px Archivo, sans-serif'; x.fillStyle='#F3F1EB';
    x.fillText(String(score), W/2, H*0.415);

    sp('4px');
    x.font='900 56px Archivo, sans-serif'; x.fillStyle='#D9912B';
    x.fillText(band, W/2, H*0.480);

    x.strokeStyle='rgba(243,241,235,0.18)'; x.lineWidth=2;
    x.beginPath(); x.moveTo(180,H*0.536); x.lineTo(W-180,H*0.536); x.stroke();

    sp('4px');
    x.font='400 26px "IBM Plex Mono", monospace'; x.fillStyle='rgba(243,241,235,0.55)';
    x.fillText(valid+' GEÇERLİ TUR  \u00b7  ORT. '+avgScore+(early?('  \u00b7  '+early+' ERKEN'):''), W/2, H*0.579);

    sp('0px');
    x.font='900 62px Archivo, sans-serif'; x.fillStyle='#F3F1EB';
    x.fillText('Beni geçebilir misin?', W/2, H*0.681);
    x.font='500 38px "IBM Plex Sans", sans-serif'; x.fillStyle='rgba(243,241,235,0.7)';
    x.fillText('7 tur, 45 saniye, tarayıcıda.', W/2, H*0.729);

    // amber alt blok: adres
    const band0=tall?260:190;
    x.fillStyle='#D9912B'; x.fillRect(0,H-band0,W,band0);
    sp('5px');
    x.font='900 46px Archivo, sans-serif'; x.fillStyle='#111D33';
    x.fillText(url.replace(/^https?:\/\//,'').split('?')[0], W/2, H-band0+(tall?150:82));
    sp('4px');
    x.font='500 24px "IBM Plex Mono", monospace'; x.fillStyle='rgba(17,29,51,0.72)';
    x.fillText(tall?'PROFİLDEKİ LİNKE DOKUN, SEN DE ÖLÇ':'MESAJDAKİ LİNKE DOKUN, SEN DE ÖLÇ', W/2, H-band0+(tall?200:132));
    sp('0px');
    return c;
  }
  function buildCard(score, band, name, avgScore, valid, early, url){
    // Kart, kullanıcı paylaş'a basmadan ÖNCE hazırlanır; iOS'ta paylaşım
    // jesti async beklemeyi sevmiyor, dosya hazır olmalı.
    const go=function(){
      try{
        const prev=cardUrl, prevS=storyUrl;
        drawCard(score, band, name, avgScore, valid, early, url, false).toBlob(function(blob){
          if(!blob){ console.warn('REACTO: kart üretilemedi (toBlob boş)'); return; }
          try{ cardFile=new File([blob],'reacto-'+score+'.png',{type:'image/png'}); }
          catch(e){ cardFile=null; }
          cardUrl=URL.createObjectURL(blob);
          const im=document.getElementById('rxCardImg');
          if(im){ im.src=cardUrl; im.style.display='block'; }
          if(prev) URL.revokeObjectURL(prev);   // yeni URL atandıktan SONRA bırak
        },'image/png');
        drawCard(score, band, name, avgScore, valid, early, url, true).toBlob(function(blob){
          if(!blob) return;
          try{ storyFile=new File([blob],'reacto-hikaye-'+score+'.png',{type:'image/png'}); }
          catch(e){ storyFile=null; }
          storyUrl=URL.createObjectURL(blob);
          if(prevS) URL.revokeObjectURL(prevS);
        },'image/png');
      }catch(e){ console.warn('REACTO: kart çizilemedi',e); }
    };
    // Marka fontlarını açıkça yükle; gelmezse 600 ms sonra yine de çiz
    let done=false;
    const once=function(){ if(!done){ done=true; go(); } };
    setTimeout(once,600);
    try{
      if(document.fonts && document.fonts.load){
        Promise.all([
          document.fonts.load('900 300px Archivo'),
          document.fonts.load('500 30px "IBM Plex Mono"'),
          document.fonts.load('500 38px "IBM Plex Sans"')
        ]).then(once).catch(once);
      } else once();
    }catch(e){ once(); }
  }

  /* ---- REACTO skoru ----
     Ekranda ölçülen süre, cihazın kendi gecikmesini de içerir. Bu gecikmeyi düşüp
     saniyedeki tepki sayısına çeviriyoruz: yüksek skor = hızlı.
     skor = 100000 / (ölçülen - cihaz gecikmesi), payda 120 ms'nin altına inemez. */
  let frameMs = 16.7;                       // cihazın kare süresi, ölçülerek güncellenir
  function probeRefresh(){
    let n=0, first=0, last=0;
    function step(t){
      if(!n){ first=t; } else { last=t; }
      if(++n<25){ requestAnimationFrame(step); }
      else if(last>first){ frameMs=(last-first)/(n-2); }
    }
    requestAnimationFrame(step);
  }
  function deviceLag(){
    // taban gecikme (dokunmatik örnekleme + OS/tarayıcı iletimi) + kare kuantumunun yarısı
    return 45 + frameMs/2;
  }
  function reacto(ms){
    const adj = Math.max(120, ms - deviceLag());
    return Math.round(100000/adj);
  }
  function rating(score){
    if(score>=450) return 'YILDIRIM';
    if(score>=400) return 'KEDİ REFLEKSİ';
    if(score>=350) return 'KALECİ ELİ';
    if(score>=300) return 'UYANIK';
    if(score>=260) return 'SABAH KAHVESİ SONRASI';
    return 'HENÜZ ISINMADIN';
  }

        if(!url) return;
        const a=document.createElement('a');
        a.href=url; a.download=fname;
        document.body.appendChild(a); a.click(); a.remove();
      }
      function downloadCard(){ saveAs(cardUrl,'reacto-'+scoreBest+'.png'); }
      function downloadStory(){ saveAs(storyUrl,'reacto-hikaye-'+scoreBest+'.png'); }
      function shareWithCard(fallback){
        const p=payload();
        if(canShareCard()){
          navigator.share({files:[cardFile], text:p.text+'\n'+p.url})
            .catch(function(err){ if(err && err.name==='AbortError') return; fallback(p); });
          return;
        }
        fallback(p);
      }
      const wa=document.getElementById('rxShareWa');
      if(wa) wa.addEventListener('click',function(e){
        e.stopPropagation();
        shareWithCard(function(p){
          // Cihaz dosya paylaşımını desteklemiyor (ör. masaüstü tarayıcı):
          // kartı indir, WhatsApp'ı metinle aç, kullanıcı kartı ekte göndersin.
          if(cardUrl){ downloadCard(); showToast('Kart indirildi \u2014 WhatsApp\u2019ta ekleyip gönder'); }
          window.open('https://wa.me/?text='+encodeURIComponent(p.text+'\n'+p.url),'_blank','noopener');
        });
      });
      const ig=document.getElementById('rxShareIg');
      if(ig) ig.addEventListener('click',function(e){
        e.stopPropagation();
        // Instagram metin/link almaz; yalnızca görsel kabul eder. 9:16 hikaye kartı gönderilir.
        if(canShareFile(storyFile)){
          navigator.share({files:[storyFile]})
            .catch(function(err){
              if(err && err.name==='AbortError') return;
              if(storyUrl){ downloadStory(); showToast('Hikaye kartı indirildi \u2014 Instagram\u2019dan ekle'); }
            });
          return;
        }
        if(storyUrl){ downloadStory(); showToast('Hikaye kartı indirildi \u2014 Instagram\u2019dan hikayene ekle'); }
        else { copy(); showToast('Kart hazırlanıyor, bir saniye'); }
      });
      const more=document.getElementById('rxShareMore');
      if(more) more.addEventListener('click',function(e){
        e.stopPropagation();
        shareWithCard(function(p){
          navigator.share({title:'Locomotion REACTO',text:p.text,url:p.url}).catch(function(){});
        });
      });
      const dl=document.getElementById('rxCardDl');
      if(dl) dl.addEventListener('click',function(e){
        e.stopPropagation();
        if(cardUrl){ downloadCard(); showToast('Kart indirildi'); }
        else showToast('Kart hazırlanıyor, bir saniye');
      });
      const cp=document.getElementById('rxShareCopy');
      if(cp) cp.addEventListener('click',function(e){
        e.stopPropagation(); copy(); showToast('Link kopyalandı');
      });
    })();
  }
  function showToast(msg){
    toast.textContent=msg; toast.classList.add('rx-show');
    setTimeout(function(){toast.classList.remove('rx-show');},2600);
  }

  stage.addEventListener('pointerdown',function(){
    if(state==='waiting') earlyTap();
    else if(state==='go') recordTap();
    else if(state==='finished' && actx && actx.state==='suspended') actx.resume();
  });

  function openModal(e){
    if(e) e.preventDefault();
    times=[]; clearTimeout(timerId);
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    probeRefresh();
    showIntro();
  }
  function closeModal(){
    clearAll();
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
  }
  if(closeBtn) closeBtn.addEventListener('click',closeModal);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&overlay.classList.contains('open')) closeModal(); });

  // triggers: nav link + game-band button open the modal (fallback: navigate to reaksiyon.html if JS off)
  // Tek sayfa sürüm: test doğrudan açılır.
  openModal();

  // arrival via a shared challenge link: ?meydan=<rakibin rekoru>&tur=<kaçıncı raund>&skor=<benim önceki skorum>
  (function(){
    const q = new URLSearchParams(window.location.search);
    const target = q.get('meydan');
    if(!target) return;
    challengeTarget = parseInt(target,10) || null;
    duelRound = parseInt(q.get('tur'),10) || 1;
    myLastScore = parseInt(q.get('skor'),10) || null;
    leaderName = cleanName(q.get('ad')) || null;
    leaderAt = parseInt(q.get('t'),10) || null;
    /* tek sayfa sürümde modal zaten açık */
  })();
  // (Ana sayfadaki hero paneli bu tek sayfa sürümde yok.)
})();
</script>
</body>
</html>
